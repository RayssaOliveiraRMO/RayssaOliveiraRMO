<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 382" width="800" height="382" font-family="'Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="15">
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="0.5" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
  <rect x="1" y="1" width="798" height="380" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 h774 a12 12 0 0 1 12 12 v25 h-798 z" fill="#161b22"/>
  <line x1="1" y1="38" x2="799" y2="38" stroke="#30363d"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="400" y="25" text-anchor="middle" fill="#8b949e" font-size="13">about.exe</text>
  <rect x="1" y="38" width="4" height="332" fill="url(#g)" opacity="0.8"/>
  <text x="40" y="78" fill="#22d3ee" font-weight="700" opacity="0">$ ./about.exe<animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.3s" fill="freeze"/></text><text x="40" y="122" fill="#e6edf3" font-weight="400" opacity="0">Tecnologia para mim não é apenas código.<animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.3s" fill="freeze"/></text><text x="40" y="166" fill="#c9d1d9" font-weight="400" opacity="0">É entender problemas, trabalhar com dados,<animate attributeName="opacity" from="0" to="1" begin="1.00s" dur="0.3s" fill="freeze"/></text><text x="40" y="188" fill="#c9d1d9" font-weight="400" opacity="0">melhorar processos e transformar necessidades<animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.3s" fill="freeze"/></text><text x="40" y="210" fill="#c9d1d9" font-weight="400" opacity="0">de negócio em soluções.<animate attributeName="opacity" from="0" to="1" begin="1.70s" dur="0.3s" fill="freeze"/></text><text x="40" y="254" fill="#c9d1d9" font-weight="400" opacity="0">Atualmente, estou construindo minha trajetória<animate attributeName="opacity" from="0" to="1" begin="2.05s" dur="0.3s" fill="freeze"/></text><text x="40" y="276" fill="#c9d1d9" font-weight="400" opacity="0">unindo tecnologia, análise de dados,<animate attributeName="opacity" from="0" to="1" begin="2.40s" dur="0.3s" fill="freeze"/></text><text x="40" y="298" fill="#c9d1d9" font-weight="400" opacity="0">desenvolvimento e visão de negócio.<animate attributeName="opacity" from="0" to="1" begin="2.75s" dur="0.3s" fill="freeze"/></text><text x="40" y="342" font-weight="700" opacity="0"><tspan fill="#f472b6">&gt; </tspan><tspan fill="url(#g)">Sempre aprendendo. Sempre construindo.</tspan><animate attributeName="opacity" from="0" to="1" begin="3.10s" dur="0.4s" fill="freeze"/></text><rect x="402" y="328" width="10" height="18" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="3.50s" dur="1s" repeatCount="indefinite"/></rect>
</svg>